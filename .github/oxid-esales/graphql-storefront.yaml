# {{ $ids := "oe_graphql_storefront" }}ids: {{ $ids }}
# {{ $org := "oxid-esales" }}organisation: {{ $org }}
# {{ $name := "graphql-storefront" }}name: {{ $name }}
# {{ $repo := "OXID-eSales/graphql-storefront-module" }}repo: {{ $repo }}

install:
  cache:
    prepared_shop: false
  composer:
    root_url: ''
    transform: |
      {
        "require": {
          "oxid-esales/oxideshop-ce": "{{ .Data.install.composer.dev_ref }}",
          "oxid-esales/twig-component": "{{ .Data.install.composer.dev_ref }}",
          "oxid-esales/twig-admin-theme": "{{ .Data.install.composer.dev_ref }}",
          "oxid-esales/apex-theme": "{{ .Data.install.composer.dev_ref }}",
          "oxid-esales/graphql-base": "{{ .Data.install.composer.dev_ref }}",
          "oxid-esales/developer-tools": "{{ .Data.install.composer.dev_ref }}"
        }
      }
  custom_script_container: |
    sed -i 's/<?php/<?php\n\nrequire(__DIR__ . "\/..\/c3.php");/' vendor/oxid-esales/oxideshop-ce/source/bootstrap.php
    perl -pi -e 'print "SetEnvIf Authorization \"(.*)\" HTTP_AUTHORIZATION=\$1\n\n" if $. == 1' source/.htaccess

    vendor/bin/oe-console oe:database:reset --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
    vendor/bin/oe-console oe:module:install ./
    vendor/bin/oe-eshop-doctrine_migration migrations:migrate
    vendor/bin/oe-eshop-db_views_generate
    vendor/bin/oe-console oe:setup:demodata

    vendor/bin/oe-console oe:module:activate oe_graphql_base
    vendor/bin/oe-console oe:module:activate "{{ $ids }}"
    vendor/bin/oe-console oe:theme:activate apex

runscript: &runscript
  matrix:
    script: |
      [
        "report:tests-unit",
        "report:tests-integration",
        "no_report:tests-codeception -- -g address",
        "no_report:tests-codeception -- -g basket --shard 1/2",
        "no_report:tests-codeception -- -g basket --shard 2/2",
        "no_report:tests-codeception -- -g other --shard 1/4",
        "no_report:tests-codeception -- -g other --shard 2/4",
        "no_report:tests-codeception -- -g other --shard 3/4",
        "no_report:tests-codeception -- -g other --shard 4/4",
        "no_report:tests-codeception -- -g pricing"
      ]
  report:
    path: ''
  no_report:
    path: ''
    coverage_prefix: ''

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "report:phpstan-report",
        "no_report:phpmd",
        "no_report:phpcs"
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/'
  organization: 'oxid-esales'
  project_key: 'OXID-eSales_graphql-storefront-module'
  project_name: '{{ $org}}/{{ $name }}'
  target_branch: 'b-7.6.x'
  parameters: >
    -Dsonar.language=php
    -Dsonar.scm.provider=git
    -Dsonar.sources=src
    -Dsonar.tests=tests

finish:
  slack_title: '{{ print $name }} ({{ .Data.install.git.ref }}) by {{ .Github.Actor }}'
